name: Recorded frontend verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium --only-shell
      # Includes the existing scientific/deployment gates and emitted-byte verification.
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: web/test-results/browser/
          if-no-files-found: warn
